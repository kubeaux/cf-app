<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La Truculance · Échéance</title>
  <meta name="theme-color" content="#0f0e0d">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Truculance">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="haut">
    <a class="logo" href="./" aria-label="La Truculance, retour au catalogue">
      <img src="favicon.svg" alt="" width="34" height="34">
      <span><i>La</i> Truculance<b>.</b></span>
    </a>
    <a class="chip" href="./">Textes</a>
  </header>

  <main>
    <section class="hero">
      <p class="kicker">Prochaine échéance</p>
      <h1>Qui passe <em>quand.</em></h1>
      <p id="titre-echeance" class="echeance-titre"></p>
    </section>

    <p id="message" class="admin-info" role="status" hidden></p>

    <!-- « C'est moi » : le choix reste sur cet appareil -->
    <section id="moi" hidden></section>

    <div id="onglets" class="admin-onglets" role="tablist" hidden></div>
    <section id="liste" class="liste"></section>
  </main>

  <script src="config.js"></script>
  <script src="echeance.js"></script>
</body>
</html>
